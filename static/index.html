<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Clipping Automation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f7f8fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:24px 16px 50px}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#171c26;border:1px solid #2a3240;font-size:11px;letter-spacing:.08em;font-weight:800}.card{background:#11151d;border:1px solid #252c38;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 10px 35px #0003}h1{font-size:clamp(30px,8vw,48px);line-height:1.02;margin:16px 0 10px}h2{margin:0 0 14px}p{color:#aeb7c6;line-height:1.55}.drop{display:block;border:1px dashed #485365;border-radius:18px;padding:28px 16px;text-align:center;cursor:pointer;background:#0c1017}.drop strong{display:block;margin:7px 0}.drop span{display:block;color:#9da8ba;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drop input{display:none}button{width:100%;padding:15px 18px;border:0;border-radius:14px;background:#fff;color:#0b0d12;font-weight:800;font-size:16px;margin-top:14px}button:disabled{opacity:.5}.status{margin-top:16px;padding:13px;border-radius:14px;background:#0a0d13;border:1px solid #242b36;white-space:pre-wrap;line-height:1.45}.progress{height:8px;background:#252c38;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:#fff;transition:width .4s}.clip{padding:15px 0;border-bottom:1px solid #252c38}.clip:last-child{border-bottom:0}.cliprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.clip a{color:#fff;font-weight:800;text-decoration:none;background:#1b2230;padding:9px 12px;border-radius:10px;white-space:nowrap}.meta{font-size:12px;color:#8f99aa;margin-top:5px}.hook{font-size:13px;color:#c5ccd8;margin-top:8px}.hidden{display:none}.error{color:#ffabab}.ok{color:#a8f0c0}.warn{color:#ffd58a}.small{font-size:12px;color:#7f8999}</style>
</head>
<body><main class="wrap">
<span class="badge">AI VIDEO CLIPPING MVP</span>
<h1>Turn long videos into short clips.</h1>
<p>Upload a video and the system will transcribe it, find high-potential moments, create vertical 9:16 clips, burn captions, and run QA.</p>
<section class="card">
<label class="drop" for="video">🎬<strong id="name">Choose a video</strong><span>MP4, MOV, MKV or WEBM · max 500 MB</span><input id="video" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/webm"></label>
<button id="go">Process Video</button>
<div id="status" class="status hidden"></div><div class="progress hidden" id="progress"><div class="bar" id="bar"></div></div>
</section>
<section class="card hidden" id="results"><h2>Generated Clips</h2><div id="clips"></div></section>
<section class="card"><div class="small" id="health">Checking system health…</div></section>
</main>
<script>
const $=id=>document.getElementById(id),file=$('video'),go=$('go'),status=$('status'),results=$('results'),clips=$('clips'),bar=$('bar');
const API_BASE=window.location.origin;
file.onchange=()=>{$('name').textContent=file.files[0]?.name||'Choose a video'};
function show(text,cls=''){status.className='status '+cls;status.textContent=text;status.classList.remove('hidden')}
async function jsonResponse(r){const type=r.headers.get('content-type')||'';const text=await r.text();if(!type.includes('application/json')){throw new Error(`Server returned ${r.status} ${r.statusText} instead of JSON. URL: ${r.url}`)};try{return JSON.parse(text)}catch{throw new Error(`Server returned invalid JSON (HTTP ${r.status}).`)}}
async function health(){try{const r=await fetch(`${API_BASE}/api/health?ts=${Date.now()}`,{cache:'no-store',headers:{'Accept':'application/json'}});const j=await jsonResponse(r);$('health').textContent=`System: ${j.groq_configured?'Groq ready':'Groq key missing'} · ${j.ffmpeg_available?'FFmpeg ready':'FFmpeg missing'} · max ${j.max_upload_mb} MB`;if(!j.groq_configured||!j.ffmpeg_available)$('health').className='small warn'}catch(e){$('health').textContent='System health unavailable: '+(e.message||'unknown error')}}
async function goProcess(){const f=file.files[0];if(!f)return show('Choose a video first.','error');if(f.size>500*1024*1024)return show('Video is larger than 500 MB.','error');go.disabled=true;results.classList.add('hidden');$('progress').classList.remove('hidden');bar.style.width='5%';show('Uploading video…');try{const fd=new FormData();fd.append('video',f,f.name);const r=await fetch(`${API_BASE}/api/process?ts=${Date.now()}`,{method:'POST',body:fd,cache:'no-store',headers:{'Accept':'application/json'}});const j=await jsonResponse(r);if(!r.ok)throw new Error(j.detail||'Upload failed');show('AI is processing your video…');bar.style.width='25%';await poll(j.job_id)}catch(e){show(e.message||'Processing failed.','error');go.disabled=false}}
async function poll(id){try{const r=await fetch(`${API_BASE}/api/jobs/${encodeURIComponent(id)}?ts=${Date.now()}`,{cache:'no-store',headers:{'Accept':'application/json'}});const j=await jsonResponse(r);if(j.status==='error'){show('Processing failed:\n'+(j.error||'Unknown error'),'error');bar.style.width='0';go.disabled=false;return}if(j.status==='done'){bar.style.width='100%';show(`Done — ${j.clips?.length||0} clip(s) passed QA.`,'ok');clips.innerHTML=(j.clips||[]).map(c=>`<div class="clip"><div class="cliprow"><div><strong>${escapeHtml(c.title||'AI Clip')}</strong><div class="meta">Score ${c.score??0} · ${formatTime(c.start)}–${formatTime(c.end)}</div></div><a href="${API_BASE}/api/jobs/${encodeURIComponent(id)}/download/${encodeURIComponent(c.file)}">Download</a></div><div class="hook">${escapeHtml(c.hook||'')}</div></div>`).join('');results.classList.remove('hidden');go.disabled=false;return}bar.style.width=j.status==='processing'?'60%':'35%';setTimeout(()=>poll(id),2500)}catch(e){show('Connection error — retrying…\n'+(e.message||''),'error');setTimeout(()=>poll(id),4000)}}
function formatTime(v){v=Number(v||0);const m=Math.floor(v/60),s=Math.floor(v%60);return `${m}:${String(s).padStart(2,'0')}`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
go.onclick=goProcess;health();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Clipping Automation</title>
<style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}button{padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff}#status{white-space:pre-wrap;margin-top:20px}.clip{display:block;margin:10px 0}</style>
</head>
<body>
<h1>AI Clipping Automation</h1>
<p>Upload an MP4 and let AI find and render short clips.</p>
<input id="v" type="file" accept="video/*">
<button onclick="go()">Process Video</button>
<div id="status"></div><div id="clips"></div>
<script>
async function go(){const f=document.getElementById('v').files[0];if(!f)return alert('Choose a video first.');const fd=new FormData();fd.append('video',f);status.textContent='Uploading...';const r=await fetch('/api/process',{method:'POST',body:fd});const j=await r.json();if(!r.ok){status.textContent=j.detail||'Upload failed';return}status.textContent='Job '+j.job_id+' started...';poll(j.job_id)}
async function poll(id){const r=await fetch('/api/jobs/'+id);const j=await r.json();status.textContent='Status: '+j.status;if(j.status==='done'){clips.innerHTML=j.clips.map(c=>`<a class="clip" href="/api/jobs/${id}/download/${encodeURIComponent(c.file)}">Download ${c.file} — ${c.title} (score ${c.score})</a>`).join('')}else if(j.status==='error'){status.textContent+='\n'+j.error}else setTimeout(()=>poll(id),3000)}
</script>
</body>
</html>
